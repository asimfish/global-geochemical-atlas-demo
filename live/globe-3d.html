const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,R,CX,CY,DPR;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  const s=Math.min(innerWidth,innerHeight);
  W=H=s;cv.width=s*DPR;cv.height=s*DPR;cv.style.width=s+'px';cv.style.height=s+'px';
  R=s*.42;CX=s/2;CY=s/2;ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();addEventListener('resize',resize);
const rad=Math.PI/180;
let lon0=-20,lat0=18,vlon=.05,dragging=false,px=0,py=0;
cv.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!dragging)return;lon0+=(e.clientX-px)*.35;lat0=Math.max(-80,Math.min(80,lat0+(e.clientY-py)*.35));px=e.clientX;py=e.clientY});
cv.addEventListener('pointerup',()=>dragging=false);
function proj(lon,lat,o){
  const φ=lat*rad,λ=(lon-lon0)*rad,χ=lat0*rad;
  const cφ=Math.cos(φ),sφ=Math.sin(φ),cλ=Math.cos(λ),sλ=Math.sin(λ),cχ=Math.cos(χ),sχ=Math.sin(χ);
  const z=sχ*sφ+cχ*cφ*cλ;
  if(z<0)return false;
  o.x=CX+R*cφ*sλ;o.y=CY-R*(cχ*sφ-sχ*cφ*cλ);o.z=z;
  return true;
}

function frame(t){
  if(!dragging)lon0+=vlon;

  }
  for(let lo=-180;lo<180;lo+=30){
    ctx.beginPath();let started=false;
    for(let la=-90;la<=90;la+=3){

    }

  }

  const s2=Math.max(1.8,R*.0075);
